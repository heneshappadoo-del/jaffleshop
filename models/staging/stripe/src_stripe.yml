version: 2

sources:
  - name: stripe
    database: raw
    schema: stripe

    tables:
      - name: payment
        config:
          loaded_at_field: _batched_at
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour

models:
  - name: stg_stripe__payment
    description: Staged Stripe payment data.

    columns:
      - name: payment_id
        description: Primary key for payments.

      - name: order_id
        description: Identifier of the related order.

      - name: payment_created
        description: Timestamp when the payment was created.

      - name: payment_status
        description: Current status of the payment.

      - name: payment_amount
        description: Payment amount converted from cents and rounded to two decimal places.