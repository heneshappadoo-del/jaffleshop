version: 2

sources:
  - name: stripe
    database: raw
    schema: stripe

    tables:
      - name: payment
        config:
          loaded_at_field: _batched_at
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 24
              period: hour

models:
  - name: stg_stripe__payments
    description: Staged Stripe payment data.

    columns:
      - name: payment_id
        description: Primary key for payments.

      - name: order_id
        description: Related order identifier.

      - name: payment_method
        description: Method used for the payment.

      - name: status
        description: Status of the payment.

      - name: amount
        description: Payment amount in dollars.

      - name: created
        description: Timestamp when the payment was created.