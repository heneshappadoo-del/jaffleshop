version: 2

models:
  - name: stg_jaffle_shop__customers
    description: Staged customer data from our jaffle shop app.

    columns:
      - name: customer_id
        description: The primary key for customers.
        data_tests:
          - unique
          - not_null

      - name: first_name
        description: Customer first name.

      - name: last_name
        description: Customer last name.

      - name: full_name
        description: Customer first and last name combined.

  - name: stg_jaffle_shop__orders
    description: Staged order data from our jaffle shop app.

    columns:
      - name: order_id
        description: The primary key for orders.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Foreign key to the staged customers model.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id

      - name: order_date
        description: Date when the order was placed.

      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending

      - name: valid_order_date
        description: >
          Order date for orders that are not returned or pending return.